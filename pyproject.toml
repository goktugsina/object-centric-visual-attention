[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-attention-research"
version = "0.1.0"
description = "Reproducible OSIE object-attention pilot and research manuscript"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "h5py>=3.11", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
